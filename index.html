    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Shifatek",
        "url": "https://www.shifatek.com/",
        "logo": "https://www.shifatek.com/logo-full-light.png",

      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Pose le thème avant le premier rendu pour éviter tout flash.
      (function () {
        try {
          var stored = localStorage.getItem('shifatek-theme')
          var theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          if (theme === 'dark') {
            document.querySelector('meta[name="theme-color"]').content = '#0d1426'
          }
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
